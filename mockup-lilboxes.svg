<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="lb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="lb-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="lb-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Laptop Mockup -->
  <g filter="url(#lb-shadow)">
    <!-- Laptop Outer Screen Bezel -->
    <rect x="25" y="20" width="450" height="280" rx="14" fill="#140a0a" stroke="#3b1212" stroke-width="2"/>
    <circle cx="250" cy="27" r="2.5" fill="#450a0a"/>
    <circle cx="250" cy="27" r="1" fill="#ef4444"/>

    <!-- Screen Display Area -->
    <g clip-path="url(#lb-clip)">
      <clipPath id="lb-clip">
        <rect x="35" y="35" width="430" height="255" rx="6"/>
      </clipPath>
      
      <!-- Screen Background -->
      <rect x="35" y="35" width="430" height="255" fill="url(#lb-bg)"/>

      <!-- Browser Top Bar -->
      <rect x="35" y="35" width="430" height="26" fill="#180707"/>
      <circle cx="48" cy="48" r="3.5" fill="#ef4444"/>
      <circle cx="59" cy="48" r="3.5" fill="#f59e0b"/>
      <circle cx="70" cy="48" r="3.5" fill="#10b981"/>
      <rect x="130" y="40" width="220" height="16" rx="4" fill="#360f0f"/>
      <text x="240" y="52" fill="#fca5a5" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">https://lilboxes-agency.com</text>

      <!-- Store Navbar -->
      <rect x="35" y="61" width="430" height="28" fill="#521111" opacity="0.95"/>
      <text x="50" y="79" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12">LIL-BOXES<tspan fill="#f87171">.</tspan></text>
      
      <!-- Nav Links -->
      <text x="250" y="78" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-size="8">Work  Agency  Services  Insights  Contact</text>
      <rect x="390" y="66" width="60" height="18" rx="9" fill="#ffffff"/>
      <text x="420" y="78" fill="#991b1b" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Audit Brand</text>

      <!-- Hero Section -->
      <g transform="translate(50, 105)">
        <text x="0" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20" letter-spacing="-0.5">High-Impact</text>
        <text x="0" y="46" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20" letter-spacing="-0.5">Editorial Web Agency</text>
        <text x="0" y="66" fill="#fee2e2" font-family="'Segoe UI', sans-serif" font-size="8.5">Bold Copywriting • Conversion Strategy • Campaigns</text>
        <rect x="0" y="76" width="75" height="20" rx="10" fill="url(#lb-btn)"/>
        <text x="37" y="89" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="8" text-anchor="middle">Get Proposal</text>

        <!-- Editorial Graphic Illustration -->
        <g transform="translate(195, 0)">
          <rect x="10" y="10" width="90" height="80" rx="6" fill="#180707" stroke="#ef4444" stroke-width="1.5"/>
          <text x="55" y="32" fill="#ef4444" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13" text-anchor="middle">+148%</text>
          <text x="55" y="46" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-size="6.5" text-anchor="middle">Lead Conversion</text>
          <!-- Mini Bar Chart -->
          <rect x="25" y="65" width="8" height="15" fill="#f87171" rx="2"/>
          <rect x="38" y="58" width="8" height="22" fill="#f87171" rx="2"/>
          <rect x="51" y="50" width="8" height="30" fill="#f87171" rx="2"/>
          <rect x="64" y="42" width="8" height="38" fill="#f87171" rx="2"/>
          <rect x="77" y="32" width="8" height="48" fill="#ffffff" rx="2"/>
        </g>
      </g>

      <!-- Services Strip -->
      <g transform="translate(50, 230)">
        <rect x="0" y="0" width="70" height="42" rx="6" fill="#360f0f"/>
        <text x="35" y="20" font-size="12" text-anchor="middle">📰</text>
        <text x="35" y="34" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Editorial UI</text>

        <rect x="85" y="0" width="70" height="42" rx="6" fill="#360f0f"/>
        <text x="120" y="20" font-size="12" text-anchor="middle">🎯</text>
        <text x="120" y="34" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Conversion</text>

        <rect x="170" y="0" width="70" height="42" rx="6" fill="#360f0f"/>
        <text x="205" y="20" font-size="12" text-anchor="middle">✒️</text>
        <text x="205" y="34" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Bold Copy</text>

        <rect x="255" y="0" width="70" height="42" rx="6" fill="#360f0f"/>
        <text x="290" y="20" font-size="12" text-anchor="middle">🚀</text>
        <text x="290" y="34" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Campaigns</text>
      </g>
    </g>

    <!-- Laptop Base -->
    <path d="M10,300 L490,300 L510,312 L0,312 Z" fill="#240a0a"/>
    <rect x="210" y="300" width="80" height="4" rx="2" fill="#5c1515"/>
  </g>

  <!-- Overlapping Smartphone Mockup -->
  <g transform="translate(420, 100)" filter="url(#lb-shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="145" height="260" rx="24" fill="#1f0909" stroke="#4a1515" stroke-width="3"/>
    <rect x="2" y="2" width="141" height="256" rx="22" fill="#0d0303" stroke="#ef4444" stroke-width="1"/>
    
    <!-- Phone Screen Content -->
    <g clip-path="url(#lb-phone-clip)">
      <clipPath id="lb-phone-clip">
        <rect x="6" y="8" width="133" height="244" rx="18"/>
      </clipPath>
      
      <rect x="6" y="8" width="133" height="244" fill="url(#lb-bg)"/>
      
      <!-- Phone Top Notch -->
      <rect x="42" y="10" width="60" height="12" rx="6" fill="#000000"/>
      
      <!-- Phone App Header -->
      <text x="18" y="38" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="9">LIL-BOXES<tspan fill="#f87171">.</tspan></text>

      <!-- Phone Hero -->
      <text x="18" y="58" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">Editorial Web</text>
      <text x="18" y="70" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">Agency</text>
      <text x="18" y="84" fill="#fee2e2" font-family="'Segoe UI', sans-serif" font-size="6.5">Conversion Focused</text>
      <rect x="18" y="90" width="55" height="15" rx="7.5" fill="url(#lb-btn)"/>
      <text x="45" y="101" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="6" text-anchor="middle">Start Project</text>

      <!-- Chart Graphic on Phone -->
      <g transform="translate(85, 60) scale(0.45)">
        <rect x="0" y="0" width="65" height="50" rx="4" fill="#180707" stroke="#ef4444" stroke-width="1"/>
        <text x="32" y="16" fill="#f87171" font-weight="bold" font-size="10" text-anchor="middle">+148%</text>
        <line x1="8" y1="42" x2="58" y2="24" stroke="#ffffff" stroke-width="2"/>
      </g>

      <!-- Phone Features Items -->
      <g transform="translate(14, 125)">
        <rect x="0" y="0" width="56" height="34" rx="6" fill="#360f0f"/>
        <text x="28" y="15" font-size="10" text-anchor="middle">📰</text>
        <text x="28" y="27" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Editorial</text>

        <rect x="62" y="0" width="56" height="34" rx="6" fill="#360f0f"/>
        <text x="90" y="15" font-size="10" text-anchor="middle">🎯</text>
        <text x="90" y="27" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Audit</text>

        <rect x="0" y="42" width="56" height="34" rx="6" fill="#360f0f"/>
        <text x="28" y="57" font-size="10" text-anchor="middle">✒️</text>
        <text x="28" y="69" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Strategy</text>

        <rect x="62" y="42" width="56" height="34" rx="6" fill="#360f0f"/>
        <text x="90" y="57" font-size="10" text-anchor="middle">🚀</text>
        <text x="90" y="69" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Growth</text>
      </g>

      <!-- Bottom Phone Indicator -->
      <rect x="45" y="244" width="45" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>
</svg>
