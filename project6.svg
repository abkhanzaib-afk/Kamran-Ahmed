  <text x="90" y="770" fill="#d6d3d1" font-family="sans-serif" font-size="13">Organic greens, feta cheese, olives, and olive oil.</text>
  <text x="90" y="805" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold">\$14.00</text>

  <!-- Food Card 4 -->
  <rect x="420" y="670" width="320" height="170" rx="8" fill="#44403c" />
  <text x="450" y="710" fill="#fbbf24" font-family="sans-serif" font-size="22">🍰</text>
  <text x="450" y="745" fill="#ffffff" font-family="serif" font-size="17" font-weight="bold">Classic Chocolate Lava Cake</text>
  <text x="450" y="770" fill="#d6d3d1" font-family="sans-serif" font-size="13">Warm molten chocolate cake with vanilla bean gelato.</text>
  <text x="450" y="805" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold">\$11.50</text>

