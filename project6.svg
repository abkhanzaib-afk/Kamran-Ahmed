  <text x="90" y="1065" fill="#e7e5e4" font-family="sans-serif" font-size="13">Mon - Thu: 12:00 PM - 10:00 PM</text>
  <text x="90" y="1090" fill="#e7e5e4" font-family="sans-serif" font-size="13">Fri - Sun: 12:00 PM - 11:30 PM</text>

  <rect x="420" y="990" width="320" height="160" rx="8" fill="#292524" />
  <text x="450" y="1030" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">📍 Location</text>
  <text x="450" y="1065" fill="#e7e5e4" font-family="sans-serif" font-size="13">45 Grand Avenue, Downtown</text>
  <text x="450" y="1090" fill="#e7e5e4" font-family="sans-serif" font-size="13">Phone: (555) 234-5678</text>

