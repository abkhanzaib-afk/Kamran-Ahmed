  <rect y="1230" width="800" height="370" fill="#0c0a09" />
  <text x="400" y="1310" fill="#ffffff" font-family="serif" font-size="24" font-weight="bold" text-anchor="middle">Reserve Your Table Online</text>
  <rect x="330" y="1340" width="140" height="42" rx="6" fill="url(#p6-amber)" />
  <text x="400" y="1366" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Book a Table</text>
  <text x="400" y="1520" fill="#78716c" font-family="sans-serif" font-size="12" text-anchor="middle">© 2026 Maison Ember Restaurant. All rights reserved.</text>
