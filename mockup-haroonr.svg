<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="hr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#14141f"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="hr-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="hr-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Laptop Mockup -->
  <g filter="url(#hr-shadow)">
    <!-- Laptop Outer Screen Bezel -->
    <rect x="25" y="20" width="450" height="280" rx="14" fill="#09090d" stroke="#222230" stroke-width="2"/>
    <circle cx="250" cy="27" r="2.5" fill="#3b3b4f"/>
    <circle cx="250" cy="27" r="1" fill="#fbbf24"/>

    <!-- Screen Display Area -->
    <g clip-path="url(#hr-clip)">
      <clipPath id="hr-clip">
        <rect x="35" y="35" width="430" height="255" rx="6"/>
      </clipPath>
      
      <!-- Screen Background -->
      <rect x="35" y="35" width="430" height="255" fill="url(#hr-bg)"/>

      <!-- Browser Top Bar -->
      <rect x="35" y="35" width="430" height="26" fill="#0d0d14"/>
      <circle cx="48" cy="48" r="3.5" fill="#ef4444"/>
      <circle cx="59" cy="48" r="3.5" fill="#f59e0b"/>
      <circle cx="70" cy="48" r="3.5" fill="#10b981"/>
      <rect x="130" y="40" width="220" height="16" rx="4" fill="#1b1b26"/>
      <text x="240" y="52" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">https://haroonr-studio.dev</text>

      <!-- Store Navbar -->
      <rect x="35" y="61" width="430" height="28" fill="#12121c" opacity="0.95"/>
      <text x="50" y="79" fill="#fbbf24" font-family="'Courier New', monospace" font-weight="900" font-size="13">&lt;HAROON<tspan fill="#ffffff">R/&gt;</tspan></text>
      
      <!-- Nav Links -->
      <text x="250" y="78" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="8">Projects   Arcade   Code Vault   Game Corner</text>
      <rect x="390" y="66" width="60" height="18" rx="9" fill="url(#hr-gold)"/>
      <text x="420" y="78" fill="#000000" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Play Arcade</text>

      <!-- Hero Section -->
      <g transform="translate(50, 105)">
        <text x="0" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20" letter-spacing="-0.5">Full-Stack Dev &amp;</text>
        <text x="0" y="46" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20" letter-spacing="-0.5">Retro Arcade Labs</text>
        <text x="0" y="66" fill="#d1d5db" font-family="'Segoe UI', sans-serif" font-size="8.5">Interactive Canvas Games • Audio Synthesizer • Dark UI</text>
        <rect x="0" y="76" width="75" height="20" rx="10" fill="url(#hr-gold)"/>
        <text x="37" y="89" fill="#000000" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="8" text-anchor="middle">Launch Vault</text>

        <!-- Retro Pixel Arcade Console Graphic -->
        <g transform="translate(195, 0)">
          <!-- Console Box -->
          <rect x="10" y="10" width="90" height="80" rx="8" fill="#1a1a26" stroke="#fbbf24" stroke-width="1.5"/>
          <rect x="20" y="20" width="70" height="40" rx="4" fill="#050508" stroke="#33334d" stroke-width="1"/>
          <!-- Pixel Screen Content -->
          <text x="55" y="42" font-size="16" text-anchor="middle">👾</text>
          <!-- Controls -->
          <circle cx="35" cy="72" r="5" fill="#ef4444"/>
          <circle cx="50" cy="72" r="5" fill="#f59e0b"/>
          <circle cx="65" cy="72" r="5" fill="#10b981"/>
          <!-- D-Pad -->
          <rect x="75" y="68" width="12" height="8" rx="2" fill="#475569"/>
        </g>
      </g>

      <!-- Services Strip -->
      <g transform="translate(50, 230)">
        <rect x="0" y="0" width="70" height="42" rx="6" fill="#1a1a26"/>
        <text x="35" y="20" font-size="12" text-anchor="middle">🕹️</text>
        <text x="35" y="34" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Pixel Arcade</text>

        <rect x="85" y="0" width="70" height="42" rx="6" fill="#1a1a26"/>
        <text x="120" y="20" font-size="12" text-anchor="middle">⚡</text>
        <text x="120" y="34" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Full-Stack</text>

        <rect x="170" y="0" width="70" height="42" rx="6" fill="#1a1a26"/>
        <text x="205" y="20" font-size="12" text-anchor="middle">🎛️</text>
        <text x="205" y="34" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Audio Synth</text>

        <rect x="255" y="0" width="70" height="42" rx="6" fill="#1a1a26"/>
        <text x="290" y="20" font-size="12" text-anchor="middle">🔒</text>
        <text x="290" y="34" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Code Vault</text>
      </g>
    </g>

    <!-- Laptop Base -->
    <path d="M10,300 L490,300 L510,312 L0,312 Z" fill="#13131c"/>
    <rect x="210" y="300" width="80" height="4" rx="2" fill="#3f3f56"/>
  </g>

  <!-- Overlapping Smartphone Mockup -->
  <g transform="translate(420, 100)" filter="url(#hr-shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="145" height="260" rx="24" fill="#11111a" stroke="#2a2a3d" stroke-width="3"/>
    <rect x="2" y="2" width="141" height="256" rx="22" fill="#07070a" stroke="#fbbf24" stroke-width="1"/>
    
    <!-- Phone Screen Content -->
    <g clip-path="url(#hr-phone-clip)">
      <clipPath id="hr-phone-clip">
        <rect x="6" y="8" width="133" height="244" rx="18"/>
      </clipPath>
      
      <rect x="6" y="8" width="133" height="244" fill="url(#hr-bg)"/>
      
      <!-- Phone Top Notch -->
      <rect x="42" y="10" width="60" height="12" rx="6" fill="#000000"/>
      
      <!-- Phone App Header -->
      <text x="18" y="38" fill="#fbbf24" font-family="'Courier New', monospace" font-weight="900" font-size="9">&lt;HAROONR/&gt;</text>

      <!-- Phone Hero -->
      <text x="18" y="58" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">Retro Arcade</text>
      <text x="18" y="70" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">&amp; Code Vault</text>
      <text x="18" y="84" fill="#d1d5db" font-family="'Segoe UI', sans-serif" font-size="6.5">Creative Tech Lab</text>
      <rect x="18" y="90" width="55" height="15" rx="7.5" fill="url(#hr-gold)"/>
      <text x="45" y="101" fill="#000000" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="6" text-anchor="middle">Play Now</text>

      <!-- Arcade on Phone -->
      <g transform="translate(80, 55) scale(0.45)">
        <rect x="0" y="0" width="65" height="50" rx="4" fill="#1a1a26" stroke="#fbbf24" stroke-width="1"/>
        <text x="32" y="30" font-size="18" text-anchor="middle">👾</text>
      </g>

      <!-- Phone Features Items -->
      <g transform="translate(14, 125)">
        <rect x="0" y="0" width="56" height="34" rx="6" fill="#1a1a26"/>
        <text x="28" y="15" font-size="10" text-anchor="middle">🕹️</text>
        <text x="28" y="27" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Arcade</text>

        <rect x="62" y="0" width="56" height="34" rx="6" fill="#1a1a26"/>
        <text x="90" y="15" font-size="10" text-anchor="middle">⚡</text>
        <text x="90" y="27" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">FullStack</text>

        <rect x="0" y="42" width="56" height="34" rx="6" fill="#1a1a26"/>
        <text x="28" y="57" font-size="10" text-anchor="middle">🎛️</text>
        <text x="28" y="69" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Synth</text>

        <rect x="62" y="42" width="56" height="34" rx="6" fill="#1a1a26"/>
        <text x="90" y="57" font-size="10" text-anchor="middle">🔒</text>
        <text x="90" y="69" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Vault</text>
      </g>

      <!-- Bottom Phone Indicator -->
      <rect x="45" y="244" width="45" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>
</svg>
