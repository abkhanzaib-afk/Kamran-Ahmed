<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="lw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043227"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022119"/>
    </linearGradient>
    <linearGradient id="lw-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="lw-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Laptop Mockup -->
  <g filter="url(#lw-shadow)">
    <!-- Laptop Outer Screen Bezel -->
    <rect x="25" y="20" width="450" height="280" rx="14" fill="#091319" stroke="#163832" stroke-width="2"/>
    <circle cx="250" cy="27" r="2.5" fill="#134e4a"/>
    <circle cx="250" cy="27" r="1" fill="#2dd4bf"/>

    <!-- Screen Display Area -->
    <g clip-path="url(#lw-clip)">
      <clipPath id="lw-clip">
        <rect x="35" y="35" width="430" height="255" rx="6"/>
      </clipPath>
      
      <!-- Screen Background -->
      <rect x="35" y="35" width="430" height="255" fill="url(#lw-bg)"/>

      <!-- Browser Top Bar -->
      <rect x="35" y="35" width="430" height="26" fill="#03211a"/>
      <circle cx="48" cy="48" r="3.5" fill="#ef4444"/>
      <circle cx="59" cy="48" r="3.5" fill="#f59e0b"/>
      <circle cx="70" cy="48" r="3.5" fill="#10b981"/>
      <rect x="130" y="40" width="220" height="16" rx="4" fill="#08382c"/>
      <text x="240" y="52" fill="#5eead4" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">https://lotuswellness.spa</text>

      <!-- Store Navbar -->
      <rect x="35" y="61" width="430" height="28" fill="#042e23" opacity="0.95"/>
      <text x="50" y="79" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12">🌿 LOTUS<tspan fill="#2dd4bf">WELLNESS</tspan></text>
      
      <!-- Nav Links -->
      <text x="250" y="78" fill="#ccfbf1" font-family="'Segoe UI', sans-serif" font-size="8">Home  Services  Treatments  About  Contact</text>
      <rect x="390" y="66" width="60" height="18" rx="9" fill="url(#lw-btn)"/>
      <text x="420" y="78" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Book Now</text>

      <!-- Hero Section -->
      <g transform="translate(50, 105)">
        <text x="0" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20" letter-spacing="-0.5">Relax • Rejuvenate</text>
        <text x="0" y="46" fill="#2dd4bf" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20" letter-spacing="-0.5">• Rebalance</text>
        <text x="0" y="66" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="8.5">Your Wellness Journey Begins Here</text>
        <rect x="0" y="76" width="75" height="20" rx="10" fill="url(#lw-btn)"/>
        <text x="37" y="89" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="8" text-anchor="middle">Book Session</text>

        <!-- Zen Stones Illustration -->
        <g transform="translate(180, 5)">
          <!-- Bottom stone -->
          <ellipse cx="60" cy="75" rx="45" ry="14" fill="#1c1917"/>
          <ellipse cx="60" cy="74" rx="43" ry="12" fill="#292524"/>
          <ellipse cx="55" cy="70" rx="30" ry="6" fill="#44403c" opacity="0.5"/>
          <!-- Middle stone -->
          <ellipse cx="60" cy="54" rx="34" ry="11" fill="#1c1917"/>
          <ellipse cx="60" cy="53" rx="32" ry="9" fill="#292524"/>
          <ellipse cx="56" cy="50" rx="22" ry="5" fill="#44403c" opacity="0.5"/>
          <!-- Top stone -->
          <ellipse cx="60" cy="36" rx="22" ry="8" fill="#1c1917"/>
          <ellipse cx="60" cy="35" rx="20" ry="7" fill="#292524"/>
          <ellipse cx="58" cy="33" rx="14" ry="3" fill="#44403c" opacity="0.5"/>
          
          <!-- Frangipani Flower -->
          <g transform="translate(85, 45) scale(0.7)">
            <ellipse cx="20" cy="20" rx="16" ry="10" fill="#ffffff" transform="rotate(0 20 20)"/>
            <ellipse cx="20" cy="20" rx="16" ry="10" fill="#ffffff" transform="rotate(72 20 20)"/>
            <ellipse cx="20" cy="20" rx="16" ry="10" fill="#ffffff" transform="rotate(144 20 20)"/>
            <ellipse cx="20" cy="20" rx="16" ry="10" fill="#ffffff" transform="rotate(216 20 20)"/>
            <ellipse cx="20" cy="20" rx="16" ry="10" fill="#ffffff" transform="rotate(288 20 20)"/>
            <circle cx="20" cy="20" r="7" fill="#fbbf24"/>
            <circle cx="20" cy="20" r="3" fill="#f59e0b"/>
          </g>
        </g>
      </g>

      <!-- Services Strip -->
      <g transform="translate(50, 230)">
        <rect x="0" y="0" width="70" height="42" rx="6" fill="#063d30"/>
        <text x="35" y="20" font-size="12" text-anchor="middle">💆‍♀️</text>
        <text x="35" y="34" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Massage</text>

        <rect x="85" y="0" width="70" height="42" rx="6" fill="#063d30"/>
        <text x="120" y="20" font-size="12" text-anchor="middle">✨</text>
        <text x="120" y="34" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Facials</text>

        <rect x="170" y="0" width="70" height="42" rx="6" fill="#063d30"/>
        <text x="205" y="20" font-size="12" text-anchor="middle">🌸</text>
        <text x="205" y="34" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Body Detox</text>

        <rect x="255" y="0" width="70" height="42" rx="6" fill="#063d30"/>
        <text x="290" y="20" font-size="12" text-anchor="middle">🧘</text>
        <text x="290" y="34" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Wellness</text>
      </g>
    </g>

    <!-- Laptop Base -->
    <path d="M10,300 L490,300 L510,312 L0,312 Z" fill="#0f2621"/>
    <rect x="210" y="300" width="80" height="4" rx="2" fill="#134e4a"/>
  </g>

  <!-- Overlapping Smartphone Mockup -->
  <g transform="translate(420, 100)" filter="url(#lw-shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="145" height="260" rx="24" fill="#061f18" stroke="#134e4a" stroke-width="3"/>
    <rect x="2" y="2" width="141" height="256" rx="22" fill="#021410" stroke="#2dd4bf" stroke-width="1"/>
    
    <!-- Phone Screen Content -->
    <g clip-path="url(#lw-phone-clip)">
      <clipPath id="lw-phone-clip">
        <rect x="6" y="8" width="133" height="244" rx="18"/>
      </clipPath>
      
      <rect x="6" y="8" width="133" height="244" fill="url(#lw-bg)"/>
      
      <!-- Phone Top Notch -->
      <rect x="42" y="10" width="60" height="12" rx="6" fill="#000000"/>
      
      <!-- Phone App Header -->
      <text x="18" y="38" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="9">🌿 LOTUS<tspan fill="#2dd4bf">SPA</tspan></text>
      <text x="120" y="38" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9">📅</text>

      <!-- Phone Hero -->
      <text x="18" y="58" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">Relax &amp;</text>
      <text x="18" y="70" fill="#2dd4bf" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">Rejuvenate</text>
      <text x="18" y="84" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="6.5">Spa &amp; Organic Care</text>
      <rect x="18" y="90" width="55" height="15" rx="7.5" fill="url(#lw-btn)"/>
      <text x="45" y="101" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="6" text-anchor="middle">Book Session</text>

      <!-- Stones Graphic on Phone -->
      <g transform="translate(85, 60) scale(0.45)">
        <ellipse cx="40" cy="50" rx="30" ry="10" fill="#292524"/>
        <ellipse cx="40" cy="38" rx="22" ry="8" fill="#44403c"/>
        <ellipse cx="40" cy="27" rx="14" ry="6" fill="#57534e"/>
        <circle cx="60" cy="35" r="8" fill="#ffffff"/>
        <circle cx="60" cy="35" r="3" fill="#fbbf24"/>
      </g>

      <!-- Phone Service Items -->
      <g transform="translate(14, 125)">
        <rect x="0" y="0" width="56" height="34" rx="6" fill="#063d30"/>
        <text x="28" y="15" font-size="10" text-anchor="middle">💆‍♀️</text>
        <text x="28" y="27" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Massage</text>

        <rect x="62" y="0" width="56" height="34" rx="6" fill="#063d30"/>
        <text x="90" y="15" font-size="10" text-anchor="middle">✨</text>
        <text x="90" y="27" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Facials</text>

        <rect x="0" y="42" width="56" height="34" rx="6" fill="#063d30"/>
        <text x="28" y="57" font-size="10" text-anchor="middle">🌸</text>
        <text x="28" y="69" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Detox</text>

        <rect x="62" y="42" width="56" height="34" rx="6" fill="#063d30"/>
        <text x="90" y="57" font-size="10" text-anchor="middle">🧘</text>
        <text x="90" y="69" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Retreat</text>
      </g>

      <!-- Bottom Phone Indicator -->
      <rect x="45" y="244" width="45" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>
</svg>
