<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="en-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110e"/>
      <stop offset="50%" stop-color="#241d17"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="en-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="en-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Laptop Mockup -->
  <g filter="url(#en-shadow)">
    <!-- Laptop Outer Screen Bezel -->
    <rect x="25" y="20" width="450" height="280" rx="14" fill="#0d0b09" stroke="#2e251e" stroke-width="2"/>
    <circle cx="250" cy="27" r="2.5" fill="#451a03"/>
    <circle cx="250" cy="27" r="1" fill="#f59e0b"/>

    <!-- Screen Display Area -->
    <g clip-path="url(#en-clip)">
      <clipPath id="en-clip">
        <rect x="35" y="35" width="430" height="255" rx="6"/>
      </clipPath>
      
      <!-- Screen Background -->
      <rect x="35" y="35" width="430" height="255" fill="url(#en-bg)"/>

      <!-- Browser Top Bar -->
      <rect x="35" y="35" width="430" height="26" fill="#120e0b"/>
      <circle cx="48" cy="48" r="3.5" fill="#ef4444"/>
      <circle cx="59" cy="48" r="3.5" fill="#f59e0b"/>
      <circle cx="70" cy="48" r="3.5" fill="#10b981"/>
      <rect x="130" y="40" width="220" height="16" rx="4" fill="#251d16"/>
      <text x="240" y="52" fill="#d4af37" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">https://eddynaboulet-studio.design</text>

      <!-- Store Navbar -->
      <rect x="35" y="61" width="430" height="28" fill="#1a1410" opacity="0.95"/>
      <text x="50" y="79" fill="#f59e0b" font-family="'Georgia', serif" font-weight="bold" font-style="italic" font-size="13">Eddy Naboulet</text>
      
      <!-- Nav Links -->
      <text x="260" y="78" fill="#e7e0d8" font-family="'Segoe UI', sans-serif" font-size="8">01 Projets   02 Parcours   03 Profil   04 Contact</text>

      <!-- Hero Section -->
      <g transform="translate(50, 105)">
        <text x="0" y="16" fill="#d97706" font-family="'Segoe UI', sans-serif" font-size="8" letter-spacing="2" font-weight="bold">DÉVELOPPEUR FRONT-END SENIOR</text>
        <text x="0" y="42" fill="#ffffff" font-family="'Georgia', serif" font-weight="bold" font-size="21" letter-spacing="-0.5">Bespoke Creative</text>
        <text x="0" y="66" fill="#f59e0b" font-family="'Georgia', serif" font-style="italic" font-size="21" letter-spacing="-0.5">Digital Architecture</text>
        <rect x="0" y="76" width="75" height="20" rx="10" fill="url(#en-gold)"/>
        <text x="37" y="89" fill="#000000" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="8" text-anchor="middle">Explorer Portfolio</text>

        <!-- Avatar / Canvas Art Illustration -->
        <g transform="translate(200, 0)">
          <circle cx="50" cy="50" r="45" fill="#1f1812" stroke="#d97706" stroke-width="1.5"/>
          <circle cx="50" cy="50" r="35" fill="#2a2018" stroke="#f59e0b" stroke-dasharray="4,3"/>
          <text x="50" y="58" font-size="34" text-anchor="middle">🎨</text>
          <!-- WebGL Nodes -->
          <circle cx="15" cy="25" r="4" fill="#f59e0b"/>
          <circle cx="85" cy="25" r="3" fill="#f59e0b"/>
          <circle cx="80" cy="80" r="4" fill="#d97706"/>
          <line x1="15" y1="25" x2="50" y2="50" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
          <line x1="85" y1="25" x2="50" y2="50" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
          <line x1="80" y1="80" x2="50" y2="50" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
        </g>
      </g>

      <!-- Services Strip -->
      <g transform="translate(50, 230)">
        <rect x="0" y="0" width="70" height="42" rx="6" fill="#241b14"/>
        <text x="35" y="20" font-size="12" text-anchor="middle">⚡</text>
        <text x="35" y="34" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Creative Dev</text>

        <rect x="85" y="0" width="70" height="42" rx="6" fill="#241b14"/>
        <text x="120" y="20" font-size="12" text-anchor="middle">🖋️</text>
        <text x="120" y="34" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Typography</text>

        <rect x="170" y="0" width="70" height="42" rx="6" fill="#241b14"/>
        <text x="205" y="20" font-size="12" text-anchor="middle">🌐</text>
        <text x="205" y="34" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">WebGL 3D</text>

        <rect x="255" y="0" width="70" height="42" rx="6" fill="#241b14"/>
        <text x="290" y="20" font-size="12" text-anchor="middle">🇫🇷</text>
        <text x="290" y="34" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Direction Art</text>
      </g>
    </g>

    <!-- Laptop Base -->
    <path d="M10,300 L490,300 L510,312 L0,312 Z" fill="#1a130e"/>
    <rect x="210" y="300" width="80" height="4" rx="2" fill="#523d2e"/>
  </g>

  <!-- Overlapping Smartphone Mockup -->
  <g transform="translate(420, 100)" filter="url(#en-shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="145" height="260" rx="24" fill="#140f0b" stroke="#3d2c20" stroke-width="3"/>
    <rect x="2" y="2" width="141" height="256" rx="22" fill="#080604" stroke="#f59e0b" stroke-width="1"/>
    
    <!-- Phone Screen Content -->
    <g clip-path="url(#en-phone-clip)">
      <clipPath id="en-phone-clip">
        <rect x="6" y="8" width="133" height="244" rx="18"/>
      </clipPath>
      
      <rect x="6" y="8" width="133" height="244" fill="url(#en-bg)"/>
      
      <!-- Phone Top Notch -->
      <rect x="42" y="10" width="60" height="12" rx="6" fill="#000000"/>
      
      <!-- Phone App Header -->
      <text x="18" y="38" fill="#f59e0b" font-family="'Georgia', serif" font-style="italic" font-weight="bold" font-size="10">Eddy Naboulet</text>

      <!-- Phone Hero -->
      <text x="18" y="58" fill="#ffffff" font-family="'Georgia', serif" font-weight="bold" font-size="11">Bespoke</text>
      <text x="18" y="70" fill="#f59e0b" font-family="'Georgia', serif" font-style="italic" font-size="11">Architecture</text>
      <text x="18" y="84" fill="#e7e0d8" font-family="'Segoe UI', sans-serif" font-size="6.5">Frontend &amp; Canvas Art</text>
      <rect x="18" y="90" width="55" height="15" rx="7.5" fill="url(#en-gold)"/>
      <text x="45" y="101" fill="#000000" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="6" text-anchor="middle">View Works</text>

      <!-- Canvas Art on Phone -->
      <g transform="translate(80, 55) scale(0.45)">
        <circle cx="45" cy="45" r="30" fill="#241b14" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="45" y="55" font-size="24" text-anchor="middle">🎨</text>
      </g>

      <!-- Phone Features Items -->
      <g transform="translate(14, 125)">
        <rect x="0" y="0" width="56" height="34" rx="6" fill="#241b14"/>
        <text x="28" y="15" font-size="10" text-anchor="middle">⚡</text>
        <text x="28" y="27" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Frontend</text>

        <rect x="62" y="0" width="56" height="34" rx="6" fill="#241b14"/>
        <text x="90" y="15" font-size="10" text-anchor="middle">🖋️</text>
        <text x="90" y="27" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Type Art</text>

        <rect x="0" y="42" width="56" height="34" rx="6" fill="#241b14"/>
        <text x="28" y="57" font-size="10" text-anchor="middle">🌐</text>
        <text x="28" y="69" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">WebGL</text>

        <rect x="62" y="42" width="56" height="34" rx="6" fill="#241b14"/>
        <text x="90" y="57" font-size="10" text-anchor="middle">🇫🇷</text>
        <text x="90" y="69" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">French Art</text>
      </g>

      <!-- Bottom Phone Indicator -->
      <rect x="45" y="244" width="45" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>
</svg>
