<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="me-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c130d"/>
      <stop offset="50%" stop-color="#2a1a0f"/>
      <stop offset="100%" stop-color="#0e0a07"/>
    </linearGradient>
    <linearGradient id="me-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="me-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Laptop Mockup -->
  <g filter="url(#me-shadow)">
    <!-- Laptop Outer Screen Bezel -->
    <rect x="25" y="20" width="450" height="280" rx="14" fill="#140f0c" stroke="#33241b" stroke-width="2"/>
    <circle cx="250" cy="27" r="2.5" fill="#451a03"/>
    <circle cx="250" cy="27" r="1" fill="#f59e0b"/>

    <!-- Screen Display Area -->
    <g clip-path="url(#me-clip)">
      <clipPath id="me-clip">
        <rect x="35" y="35" width="430" height="255" rx="6"/>
      </clipPath>
      
      <!-- Screen Background -->
      <rect x="35" y="35" width="430" height="255" fill="url(#me-bg)"/>

      <!-- Browser Top Bar -->
      <rect x="35" y="35" width="430" height="26" fill="#170f0a"/>
      <circle cx="48" cy="48" r="3.5" fill="#ef4444"/>
      <circle cx="59" cy="48" r="3.5" fill="#f59e0b"/>
      <circle cx="70" cy="48" r="3.5" fill="#10b981"/>
      <rect x="130" y="40" width="220" height="16" rx="4" fill="#2d1c13"/>
      <text x="240" y="52" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">https://maisonember.restaurant</text>

      <!-- Store Navbar -->
      <rect x="35" y="61" width="430" height="28" fill="#1e130c" opacity="0.95"/>
      <text x="50" y="79" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12">🔥 MAISON<tspan fill="#f59e0b">EMBER</tspan></text>
      
      <!-- Nav Links -->
      <text x="250" y="78" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="8">Home  Menu  About  Wines  Contact</text>
      <rect x="390" y="66" width="60" height="18" rx="9" fill="url(#me-btn)"/>
      <text x="420" y="78" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Book Table</text>

      <!-- Hero Section -->
      <g transform="translate(50, 105)">
        <text x="0" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19" letter-spacing="-0.5">Delicious Food &amp;</text>
        <text x="0" y="46" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19" letter-spacing="-0.5">Warm Ambiance</text>
        <text x="0" y="66" fill="#fdba74" font-family="'Segoe UI', sans-serif" font-size="8.5">Good Food • Great Vibes • Unforgettable Moments</text>
        <rect x="0" y="76" width="75" height="20" rx="10" fill="url(#me-btn)"/>
        <text x="37" y="89" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="8" text-anchor="middle">View Menu</text>

        <!-- Grilled Steak Illustration Platter -->
        <g transform="translate(180, 5)">
          <!-- Plate Base -->
          <ellipse cx="65" cy="65" rx="58" ry="32" fill="#0f0b08" stroke="#78350f" stroke-width="2"/>
          <ellipse cx="65" cy="64" rx="54" ry="28" fill="#1a120c"/>
          
          <!-- Grilled Steak -->
          <path d="M35,62 C35,46 55,42 75,44 C95,46 105,58 98,72 C92,84 65,86 45,80 C36,76 35,68 35,62 Z" fill="#451a03"/>
          <path d="M40,64 C40,50 58,46 75,48 C90,50 98,60 92,70 C86,80 62,82 48,76 C42,73 40,68 40,64 Z" fill="#78350f"/>
          <!-- Grill Marks -->
          <line x1="50" y1="52" x2="68" y2="70" stroke="#1c0d02" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="62" y1="50" x2="80" y2="68" stroke="#1c0d02" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="74" y1="52" x2="90" y2="68" stroke="#1c0d02" stroke-width="2.5" stroke-linecap="round"/>
          
          <!-- Rosemary Garnish & Tomatoes -->
          <circle cx="38" cy="52" r="5" fill="#ef4444"/>
          <circle cx="36" cy="50" r="1.5" fill="#ffffff" opacity="0.6"/>
          <circle cx="48" cy="44" r="4" fill="#dc2626"/>
          <!-- Herb Leaf -->
          <path d="M85,42 Q92,36 96,44 Q88,46 85,42 Z" fill="#15803d"/>
          <path d="M88,40 Q94,32 100,40 Q92,43 88,40 Z" fill="#22c55e"/>
        </g>
      </g>

      <!-- Services Strip -->
      <g transform="translate(50, 230)">
        <rect x="0" y="0" width="70" height="42" rx="6" fill="#2e1b0f"/>
        <text x="35" y="20" font-size="12" text-anchor="middle">🥩</text>
        <text x="35" y="34" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Fresh Ingredients</text>

        <rect x="85" y="0" width="70" height="42" rx="6" fill="#2e1b0f"/>
        <text x="120" y="20" font-size="12" text-anchor="middle">👨‍🍳</text>
        <text x="120" y="34" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Expert Chefs</text>

        <rect x="170" y="0" width="70" height="42" rx="6" fill="#2e1b0f"/>
        <text x="205" y="20" font-size="12" text-anchor="middle">🍷</text>
        <text x="205" y="34" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Fine Dining</text>

        <rect x="255" y="0" width="70" height="42" rx="6" fill="#2e1b0f"/>
        <text x="290" y="20" font-size="12" text-anchor="middle">✨</text>
        <text x="290" y="34" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="600" text-anchor="middle">Cozy Vibe</text>
      </g>
    </g>

    <!-- Laptop Base -->
    <path d="M10,300 L490,300 L510,312 L0,312 Z" fill="#21150f"/>
    <rect x="210" y="300" width="80" height="4" rx="2" fill="#78350f"/>
  </g>

  <!-- Overlapping Smartphone Mockup -->
  <g transform="translate(420, 100)" filter="url(#me-shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="145" height="260" rx="24" fill="#1c110a" stroke="#451a03" stroke-width="3"/>
    <rect x="2" y="2" width="141" height="256" rx="22" fill="#0e0703" stroke="#f59e0b" stroke-width="1"/>
    
    <!-- Phone Screen Content -->
    <g clip-path="url(#me-phone-clip)">
      <clipPath id="me-phone-clip">
        <rect x="6" y="8" width="133" height="244" rx="18"/>
      </clipPath>
      
      <rect x="6" y="8" width="133" height="244" fill="url(#me-bg)"/>
      
      <!-- Phone Top Notch -->
      <rect x="42" y="10" width="60" height="12" rx="6" fill="#000000"/>
      
      <!-- Phone App Header -->
      <text x="18" y="38" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="9">🔥 MAISON<tspan fill="#f59e0b">EMBER</tspan></text>
      <text x="120" y="38" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9">🍽</text>

      <!-- Phone Hero -->
      <text x="18" y="58" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">Delicious Food &amp;</text>
      <text x="18" y="70" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">Warm Ambiance</text>
      <text x="18" y="84" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="6.5">Gourmet Dinner Experience</text>
      <rect x="18" y="90" width="55" height="15" rx="7.5" fill="url(#me-btn)"/>
      <text x="45" y="101" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="6" text-anchor="middle">Book Table</text>

      <!-- Steak Graphic on Phone -->
      <g transform="translate(78, 60) scale(0.5)">
        <ellipse cx="40" cy="50" rx="36" ry="20" fill="#1a120c" stroke="#78350f" stroke-width="1"/>
        <path d="M25,50 C25,38 42,36 55,38 C68,40 72,50 68,60 C62,68 44,70 34,64 Z" fill="#78350f"/>
        <line x1="35" y1="45" x2="48" y2="58" stroke="#1c0d02" stroke-width="2"/>
        <line x1="45" y1="44" x2="58" y2="56" stroke="#1c0d02" stroke-width="2"/>
        <circle cx="28" cy="42" r="3.5" fill="#ef4444"/>
      </g>

      <!-- Phone Menu Items -->
      <g transform="translate(14, 125)">
        <rect x="0" y="0" width="56" height="34" rx="6" fill="#2e1b0f"/>
        <text x="28" y="15" font-size="10" text-anchor="middle">🥩</text>
        <text x="28" y="27" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Steaks</text>

        <rect x="62" y="0" width="56" height="34" rx="6" fill="#2e1b0f"/>
        <text x="90" y="15" font-size="10" text-anchor="middle">🍷</text>
        <text x="90" y="27" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Wines</text>

        <rect x="0" y="42" width="56" height="34" rx="6" fill="#2e1b0f"/>
        <text x="28" y="57" font-size="10" text-anchor="middle">🍰</text>
        <text x="28" y="69" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Desserts</text>

        <rect x="62" y="42" width="56" height="34" rx="6" fill="#2e1b0f"/>
        <text x="90" y="57" font-size="10" text-anchor="middle">☕</text>
        <text x="90" y="69" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="600" text-anchor="middle">Coffee</text>
      </g>

      <!-- Bottom Phone Indicator -->
      <rect x="45" y="244" width="45" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>
</svg>
