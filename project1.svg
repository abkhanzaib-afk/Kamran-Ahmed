  <text x="160" y="1105" fill="#ffffff" font-family="serif" font-size="15" font-weight="bold" text-anchor="middle">Frontend Dev</text>
  <text x="160" y="1125" fill="#a89b8d" font-family="sans-serif" font-size="11" text-anchor="middle">React, Vue &amp; Next.js</text>

  <rect x="300" y="1020" width="200" height="140" rx="10" fill="#2a221b" />
  <text x="400" y="1070" fill="#f59e0b" font-family="serif" font-size="28" text-anchor="middle">🎨</text>
  <text x="400" y="1105" fill="#ffffff" font-family="serif" font-size="15" font-weight="bold" text-anchor="middle">Art Direction</text>
  <text x="400" y="1125" fill="#a89b8d" font-family="sans-serif" font-size="11" text-anchor="middle">UI/UX &amp; Micro-animations</text>

  <rect x="540" y="1020" width="200" height="140" rx="10" fill="#2a221b" />
  <text x="640" y="1070" fill="#f59e0b" font-family="serif" font-size="28" text-anchor="middle">🌐</text>
  <text x="640" y="1105" fill="#ffffff" font-family="serif" font-size="15" font-weight="bold" text-anchor="middle">3D &amp; Canvas</text>
  <text x="640" y="1125" fill="#a89b8d" font-family="sans-serif" font-size="11" text-anchor="middle">Three.js &amp; Shader FX</text>

