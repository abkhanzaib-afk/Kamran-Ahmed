      <stop offset="0%" stop-color="#181512" />
      <stop offset="50%" stop-color="#2a221b" />
      <stop offset="100%" stop-color="#120e0b" />
    </linearGradient>
    <linearGradient id="p1-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
