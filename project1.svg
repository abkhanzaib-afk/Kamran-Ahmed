  <rect x="330" y="1390" width="140" height="42" rx="8" fill="url(#p1-gold)" />
  <text x="400" y="1416" fill="#120e0b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Contact Studio</text>
  <text x="400" y="1520" fill="#786c5f" font-family="sans-serif" font-size="12" text-anchor="middle">© 2026 Eddy Naboulet Studio. All rights reserved.</text>
