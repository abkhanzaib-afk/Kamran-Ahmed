  </defs>

  <rect width="800" height="1600" fill="url(#p1-bg)" />

  <!-- Browser Header Bar -->
  <rect width="800" height="40" fill="#120e0b" />
  <circle cx="20" cy="20" r="6" fill="#ef4444" />
  <circle cx="38" cy="20" r="6" fill="#f59e0b" />
  <circle cx="56" cy="20" r="6" fill="#10b981" />
  <rect x="150" y="10" width="500" height="20" rx="6" fill="#36291e" />
